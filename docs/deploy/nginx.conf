# V2.2 生产 Nginx 反代 — TLS 终结 + 静态前端 + API 分流 + 登录限流
# 证书路径按实际替换；前端构建产物放 /opt/sec-report-agent/frontend/dist

# 登录接口限流（配合后端账号锁定，防爆破）
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

# HTTP → HTTPS
server {
    listen 80;
    server_name report.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name report.example.com;

    ssl_certificate     /etc/nginx/ssl/report.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/report.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 静态前端（SPA）
    root /opt/sec-report-agent/frontend/dist;
    index index.html;

    # 登录接口：限流 + 反代
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 报告生成/问答可能较慢
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001;
    }

    # 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
