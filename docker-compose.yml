services:
  mysql:
    image: mysql:8.0
    container_name: sec-report-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sec_report_dev
      MYSQL_DATABASE: sec_report
      MYSQL_USER: sec_report
      MYSQL_PASSWORD: sec_report_dev
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usec_report", "-psec_report_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: sec-report-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
